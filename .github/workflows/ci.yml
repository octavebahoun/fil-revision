name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Supabase local
        run: pnpm exec supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor
      - name: Environnement de test
        run: |
          pnpm exec tsx scripts/env-local.ts
          cp .env.test.local .env
          echo "ALLOWED_EMAILS=ci@test.fil.invalid" >> .env
          pnpm exec tsx scripts/gen-secrets.ts
          pnpm exec tsx scripts/sync-allowlist.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm audit:photo
      - run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - run: pnpm audit:secrets
      - name: E2E
        run: |
          pnpm exec playwright install --with-deps chromium
          E2E_PROD_BUILD=1 pnpm e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
